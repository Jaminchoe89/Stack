<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IHH Healthcare Stack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #002820;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container { position: fixed; inset: 0; }

    /* ── Score ── */
    #score-wrap {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
      display: none;
    }
    #score-label {
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    #score-value {
      color: #fff;
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 4px 24px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
    }
    #score-value.pop { transform: scale(1.25); }

    /* ── Screens ── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      transition: opacity 0.35s ease;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      background: rgba(0, 52, 42, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 196, 160, 0.18);
      border-radius: 28px;
      padding: 48px 56px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 32px 80px rgba(0,0,0,0.55);
    }

    .logo { width: 210px; margin-bottom: 32px; }

    .screen h1 {
      color: #fff;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .screen p {
      color: rgba(255,255,255,0.5);
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 32px;
    }

    .btn {
      background: linear-gradient(135deg, #00C4A0, #009A7C);
      color: #fff;
      border: none;
      padding: 16px 52px;
      border-radius: 100px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 24px rgba(0,196,160,0.35);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,196,160,0.45); }
    .btn:active { transform: translateY(0); }

    #final-score-label {
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    #final-score-value {
      color: #00C4A0;
      font-size: 60px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }
    #best-wrap {
      color: rgba(255,255,255,0.38);
      font-size: 13px;
      margin-bottom: 28px;
    }
    #best-value { color: rgba(255,255,255,0.65); font-weight: 600; }

    /* ── Perfect ── */
    #perfect-text {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      color: #4DFFDA;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 25;
      opacity: 0;
      text-shadow: 0 0 30px rgba(77,255,218,0.9);
    }

    /* ── Hint ── */
    #tap-hint {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 20;
      display: none;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:.7} }
  </style>
</head>
<body>

<div id="score-wrap">
  <div id="score-label">Score</div>
  <div id="score-value">0</div>
</div>

<!-- Start Screen -->
<div class="screen" id="start-screen">
  <div class="panel">
    <svg class="logo" viewBox="0 0 1000 1000"><use href="#ihh-mark"/></svg>
    <h1>Stack</h1>
    <p>Tap or press Space to place each block.<br>Land it perfectly to keep the full size!</p>
    <button class="btn" id="start-btn">Play</button>
  </div>
</div>

<!-- Game Over Screen -->
<div class="screen hidden" id="gameover-screen">
  <div class="panel">
    <svg class="logo" viewBox="0 0 1000 1000"><use href="#ihh-mark"/></svg>
    <h1>Game Over</h1>
    <div id="final-score-label">Your Score</div>
    <div id="final-score-value">0</div>
    <div id="best-wrap">Best &nbsp;<span id="best-value">0</span></div>
    <button class="btn" id="restart-btn">Play Again</button>
  </div>
</div>

<div id="perfect-text">PERFECT!</div>
<div id="tap-hint">Tap to place</div>

<script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────────────────
const BLOCK_H     = 0.4;
const INIT_SIZE   = 3.5;
const MOVE_RANGE  = 9;
const BASE_SPEED  = 9;    // high difficulty start
const MAX_SPEED   = 20;
const PERFECT_TOL = 0.15;

const PALETTE = [
  0x004D44, 0x005E54, 0x006F63, 0x008074,
  0x009185, 0x00A296, 0x00B3A7, 0x00C4B8,
  0x1ACFBF, 0x33D9C6, 0x4DE3CE, 0x66EDD6,
];

// ── Three.js ──────────────────────────────────────────────────────────────────
let scene, camera, renderer, clock;

// ── Game state ────────────────────────────────────────────────────────────────
let state = 'idle';   // idle | playing | dead
let score = 0;
let best  = 0;

let stack   = [];   // { x, z, w, d, y, mesh }
let mover   = null; // { x, z, w, d, y, axis, dir, mesh }
let falling = [];   // debris { mesh, vx, vy, vz, rx, rz }

let gameObjs = []; // meshes we add per game — cleared on reset

// Camera smooth follow
let camY     = 16;
let camLookY = 0;

// ── Audio ─────────────────────────────────────────────────────────────────────
// C major pentatonic — ascends as the tower grows
const PENTATONIC = [
  261.63, 293.66, 329.63, 392.00, 440.00,
  523.25, 587.33, 659.25, 783.99, 880.00,
  1046.50, 1174.66, 1318.51, 1567.98, 1760.00,
];

let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playPlaceSound(towerHeight, perfect) {
  ensureAudio();
  const idx   = Math.min(towerHeight, PENTATONIC.length - 1);
  const freq  = PENTATONIC[idx];
  const vol   = perfect ? 0.32 : 0.22;
  const decay = perfect ? 0.55 : 0.28;

  const hit = (f, v, d, delay) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = f;
    const t = audioCtx.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(v, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.start(t);
    osc.stop(t + d + 0.01);
  };

  hit(freq, vol, decay, 0);
  if (perfect) {
    // Play a mini chord on perfect placement
    hit(freq * 1.25, vol * 0.6, decay * 0.8, 0.06);
    hit(freq * 1.5,  vol * 0.4, decay * 0.7, 0.12);
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', init);

function init() {
  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x002820);
  scene.fog = new THREE.FogExp2(0x002820, 0.012);

  // Camera — classic isometric-ish view
  camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
  camera.position.set(14, 16, 14);
  camera.lookAt(0, 0, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // Permanent lights (never removed)
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(20, 40, 20);
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0x00C4A0, 0.3);
  fill.position.set(-15, 10, -15);
  scene.add(fill);

  clock = new THREE.Clock();

  // Input
  window.addEventListener('resize', onResize);
  document.addEventListener('click', onAction);
  document.addEventListener('touchend', e => { e.preventDefault(); onAction(); }, { passive: false });
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); onAction(); } });

  document.getElementById('start-btn').addEventListener('click',   e => { e.stopPropagation(); startGame(); });
  document.getElementById('restart-btn').addEventListener('click', e => { e.stopPropagation(); restartGame(); });

  // Place a preview foundation so the scene isn't empty on the title screen
  addFoundation();

  animate();
}

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame() {
  resetScene();
  addFoundation();
  state = 'playing';
  score = 0;
  camY = 16; camLookY = 0;

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('score-wrap').style.display   = 'block';
  document.getElementById('tap-hint').style.display     = 'block';
  setScore(0);
  spawnMover();
}

function restartGame() {
  document.getElementById('gameover-screen').classList.add('hidden');
  startGame();
}

function gameOver() {
  state = 'dead';
  if (score > best) best = score;

  // drop the mover as debris
  if (mover) {
    falling.push(makeDebrisEntry(mover.mesh));
    mover = null;
  }

  document.getElementById('score-wrap').style.display = 'none';
  document.getElementById('tap-hint').style.display   = 'none';
  document.getElementById('final-score-value').textContent = score;
  document.getElementById('best-value').textContent        = best;

  setTimeout(() => {
    document.getElementById('gameover-screen').classList.remove('hidden');
  }, 700);
}

function onAction() {
  if (state === 'playing') placeBlock();
}

// ── Scene management ──────────────────────────────────────────────────────────
function resetScene() {
  // Remove game objects (not lights)
  gameObjs.forEach(m => {
    scene.remove(m);
    m.geometry && m.geometry.dispose();
    m.material && m.material.dispose();
  });
  gameObjs = [];
  stack    = [];
  mover    = null;
  falling  = [];
}

function addFoundation() {
  const mesh = makeMesh(INIT_SIZE, BLOCK_H, INIT_SIZE, PALETTE[0]);
  mesh.position.set(0, 0, 0);
  scene.add(mesh);
  gameObjs.push(mesh);
  stack.push({ x: 0, z: 0, w: INIT_SIZE, d: INIT_SIZE, y: 0, mesh });
}

// ── Mover ─────────────────────────────────────────────────────────────────────
function spawnMover() {
  const prev = stack[stack.length - 1];
  const y    = stack.length * BLOCK_H;
  const axis = stack.length % 2 === 1 ? 'x' : 'z';
  const col  = PALETTE[Math.min(stack.length, PALETTE.length - 1)];

  const mesh = makeMesh(prev.w, BLOCK_H, prev.d, col);
  const startX = axis === 'x' ? -MOVE_RANGE : prev.x;
  const startZ = axis === 'z' ? -MOVE_RANGE : prev.z;
  mesh.position.set(startX, y, startZ);
  scene.add(mesh);
  gameObjs.push(mesh);

  mover = { x: startX, z: startZ, w: prev.w, d: prev.d, y, axis, dir: 1, mesh };
}

function speed() {
  return Math.min(BASE_SPEED + score * 0.28, MAX_SPEED);
}

// ── Place ─────────────────────────────────────────────────────────────────────
function placeBlock() {
  if (!mover) return;

  const prev = stack[stack.length - 1];

  if (mover.axis === 'x') {
    const lo  = Math.max(mover.x - mover.w / 2, prev.x - prev.w / 2);
    const hi  = Math.min(mover.x + mover.w / 2, prev.x + prev.w / 2);
    const ovr = hi - lo;
    if (ovr <= 0.01) { gameOver(); return; }

    if (Math.abs(mover.x - prev.x) < PERFECT_TOL) {
      // Perfect — snap to previous
      mover.x = prev.x;
      mover.mesh.position.x = prev.x;
      playPlaceSound(stack.length, true);
      flashPerfect();
    } else {
      playPlaceSound(stack.length, false);
      const mid = (lo + hi) / 2;
      const cut = mover.w - ovr;
      const cutCx = mover.x > prev.x ? hi + cut / 2 : lo - cut / 2;
      dropDebris(cutCx, mover.y, mover.z, cut, mover.d, mover.mesh.material.color.getHex());
      mover.x = mid;
      mover.w = ovr;
      mover.mesh.geometry.dispose();
      mover.mesh.geometry = new THREE.BoxGeometry(ovr, BLOCK_H, mover.d);
      mover.mesh.position.x = mid;
    }
  } else {
    const lo  = Math.max(mover.z - mover.d / 2, prev.z - prev.d / 2);
    const hi  = Math.min(mover.z + mover.d / 2, prev.z + prev.d / 2);
    const ovr = hi - lo;
    if (ovr <= 0.01) { gameOver(); return; }

    if (Math.abs(mover.z - prev.z) < PERFECT_TOL) {
      mover.z = prev.z;
      mover.mesh.position.z = prev.z;
      playPlaceSound(stack.length, true);
      flashPerfect();
    } else {
      playPlaceSound(stack.length, false);
      const mid = (lo + hi) / 2;
      const cut = mover.d - ovr;
      const cutCz = mover.z > prev.z ? hi + cut / 2 : lo - cut / 2;
      dropDebris(mover.x, mover.y, cutCz, mover.w, cut, mover.mesh.material.color.getHex());
      mover.z = mid;
      mover.d = ovr;
      mover.mesh.geometry.dispose();
      mover.mesh.geometry = new THREE.BoxGeometry(mover.w, BLOCK_H, ovr);
      mover.mesh.position.z = mid;
    }
  }

  stack.push({ x: mover.x, z: mover.z, w: mover.w, d: mover.d, y: mover.y, mesh: mover.mesh });
  mover = null;
  setScore(++score);
  spawnMover();
}

// ── Debris ────────────────────────────────────────────────────────────────────
function dropDebris(x, y, z, w, d, color) {
  const mesh = makeMesh(w, BLOCK_H, d, color);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  falling.push(makeDebrisEntry(mesh));
}

function makeDebrisEntry(mesh) {
  return {
    mesh,
    vy: 0,
    vx: (Math.random() - 0.5) * 2.5,
    vz: (Math.random() - 0.5) * 2.5,
    rx: (Math.random() - 0.5) * 3,
    rz: (Math.random() - 0.5) * 3,
  };
}

function stepDebris(dt) {
  falling = falling.filter(b => {
    b.vy -= 22 * dt;
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.y += b.vy * dt;
    b.mesh.position.z += b.vz * dt;
    b.mesh.rotation.x += b.rx * dt;
    b.mesh.rotation.z += b.rz * dt;
    if (b.mesh.position.y < -40) {
      scene.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
      return false;
    }
    return true;
  });
}

// ── Camera ────────────────────────────────────────────────────────────────────
function stepCamera() {
  const top = stack.length * BLOCK_H;
  camY     += (top + 16 - camY)     * 0.06;
  camLookY += (top      - camLookY) * 0.06;
  camera.position.y = camY;
  camera.lookAt(0, camLookY, 0);
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state === 'playing' && mover) {
    const s = speed();
    if (mover.axis === 'x') {
      mover.x += mover.dir * s * dt;
      mover.mesh.position.x = mover.x;
      if (Math.abs(mover.x) >= MOVE_RANGE) mover.dir *= -1;
    } else {
      mover.z += mover.dir * s * dt;
      mover.mesh.position.z = mover.z;
      if (Math.abs(mover.z) >= MOVE_RANGE) mover.dir *= -1;
    }
  }

  stepDebris(dt);
  stepCamera();
  renderer.render(scene, camera);
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function setScore(n) {
  const el = document.getElementById('score-value');
  el.textContent = n;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 120);
}

let pfTimer = null;
function flashPerfect() {
  const el = document.getElementById('perfect-text');
  clearTimeout(pfTimer);
  el.style.transition = 'none';
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%,-50%) scale(1)';
  pfTimer = setTimeout(() => {
    el.style.transition = 'opacity 0.55s ease, transform 0.55s ease';
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%,-50%) scale(1.5)';
  }, 550);
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function makeMesh(w, h, d, color) {
  const geo  = new THREE.BoxGeometry(w, h, d);
  const mat  = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  return mesh;
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
</script>
